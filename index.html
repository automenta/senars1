<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SeNARS - The Thinking TODO List</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="container" data-mode="thinking">
      <header>
        <h1>THINKING TODO LIST</h1>
        <div class="controls">
          <input type="text" id="new-thought-input" placeholder="New Thought..." />
          <button id="add-new-thought-button">Add</button>
          <button id="settings-btn">Settings</button>
        </div>
      </header>

      <main>
        <section id="active-thoughts">
          <h2>⚡ ACTIVE THOUGHTS (Priority Queue)</h2>
          <div id="active-thoughts-list"></div>
        </section>

        <section id="completed-thoughts">
          <h2>✅ COMPLETED THOUGHTS (Knowledge Base)</h2>
          <div id="completed-thoughts-list"></div>
        </section>

        <section id="schema-view">
          <h2>⚡ AUTOMATION RULES (Schemas)</h2>
          <div id="schema-list"></div>
        </section>

        <section id="scope-debugger">
          <h2>🌐 SCOPE DEBUGGER</h2>
          <div id="scope-debugger-content"></div>
        </section>
      </main>

      <footer>
        <div id="attention-metrics">
          <h3>📊 ATTENTION METRICS</h3>
          <p>Focus: <span id="focus-metric">N/A</span> | Memory: <span id="memory-metric">N/A</span> | Energy: <span id="energy-metric">N/A</span></p>
        </div>
      </footer>
    </div>

    <div id="settings-modal" class="modal">
      <div class="modal-content">
        <span class="close-btn">&times;</span>
        <h2>Settings</h2>
        <div class="setting">
          <label for="user-mode-select">User Mode:</label>
          <select id="user-mode-select">
            <option value="thinking">Thinking Mode</option>
            <option value="learning">Learning Mode</option>
            <option value="expert">Expert Mode</option>
            <option value="debugger">Debugger Mode</option>
          </select>
        </div>
        <hr/>
        <h3>LLM Configuration</h3>
        <div class="setting">
            <label for="llm-api-key">API Key:</label>
            <input type="password" id="llm-api-key" placeholder="Your API Key">
        </div>
        <div class="setting">
            <label for="llm-model-name">Model Name:</label>
            <input type="text" id="llm-model-name" placeholder="e.g., gpt-4">
        </div>
        <button id="save-llm-config-btn">Save</button>
        <p id="llm-config-status"></p>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
